<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Entree fournisseur</h3>
                <p class="text-subtitle text-muted">Liste des entrees fournisseur</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="table1">
                        <thead>
                        <tr>
                            <th class="text-center">Id</th>
                            <th class="text-center">Quantite</th>
                            <th class="text-center">Produit</th>
                            <th class="text-center">Fournisseur</th>
                            <th class="text-center">DateEntree</th>
                            <th class="text-center">DatePeremption</th>
                            <th class="text-center">Edit</th>
                            <th class="text-center">Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="entreeFournisseur : ${entreeFournisseurs}">
                            <td class="text-center" th:text="${entreeFournisseur.getId()}"></td>
                            <td class="text-center" th:text="${entreeFournisseur.getQuantite()}"></td>
                            <td class="text-center" th:text="${entreeFournisseur.getProduit().getNom()}"></td>
                            <td class="text-center" th:text="${entreeFournisseur.getFournisseur().getNom()}"></td>
                            <td class="text-center" th:text="${entreeFournisseur.getDateEntree()}"></td>
                            <td class="text-center" th:text="${entreeFournisseur.getDatePeremption()}"></td>
                            <td class="text-center">
                                <a th:href="@{/fournisseur-entree/edit(idEntreeFournisseur=${entreeFournisseur.getId()})}" class="btn icon btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/fournisseur-entree/delete(idEntreeFournisseur=${entreeFournisseur.getId()})}" class="btn icon btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/fournisseur-entree/edit}" class="btn icon btn-success">
                        <i class="bi bi-plus-circle"></i> Ajouter une entree fournisseur
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
