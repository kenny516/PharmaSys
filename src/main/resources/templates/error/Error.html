<!DOCTYPE html>
<html lang="fr">

<head>
    <div th:replace="fragments/header.html"></div>
    <title>Erreur - PharmaSys</title>
</head>

<body>
    <div id="app">
        <div th:replace="fragments/sidebar.html"></div>

        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>

            <div class="page-content">
                <section class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-content">
                                <div class="card-body">
                                    <div class="error-page container">
                                        <div class="col-md-8 col-12 offset-md-2">
                                            <div class="text-center">
                                                <i class="bi bi-exclamation-triangle-fill text-danger"
                                                    style="font-size: 6rem;"></i>
                                                <h1 class="error-title">Erreur</h1>
                                                <p class="fs-5 text-gray-600" th:text="${errorMessage}">
                                                    Un problème est survenu lors du traitement de votre demande.
                                                </p>
                                                <small class="text-muted mb-4 d-block">
                                                    Si le problème persiste, veuillez contacter l'administrateur
                                                </small>
                                                <a href="/" class="btn btn-lg btn-outline-primary mt-3">
                                                    <i class="bi bi-house-door me-2"></i>
                                                    Retour à l'accueil
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div th:replace="fragments/footer.html"></div>
        </div>
    </div>
</body>

</html>
