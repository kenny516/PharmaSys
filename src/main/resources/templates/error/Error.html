<div th:replace="fragments/sidebar.html"></div>

<div id="main">
    <header class="mb-3">
        <a href="#" class="burger-btn d-block d-xl-none">
            <i class="bi bi-justify fs-3"></i>
        </a>
    </header>

    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last">
                    <h3>Page d'erreur</h3>
                    <p class="text-subtitle text-muted">Une erreur inattendue s'est produite</p>
                </div>
            </div>
        </div>
    </div>

    <div class="page-content">
        <section class="row">
            <div class="col-12 col-lg-8 offset-lg-2">
                <div class="card">
                    <div class="card-body py-5 text-center">
                        <div class="error-icon mb-4">
                            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                        </div>

                        <h1 class="error-title display-4 text-danger mb-4">Oops!</h1>
                        <p class="error-message lead mb-4" th:text="${errorMessage}">
                            Un problème est survenu lors du traitement de votre demande.
                        </p>

                        <div class="error-details text-muted mb-4">
                            <small>Si le problème persiste, veuillez contacter l'administrateur</small>
                        </div>

                        <a href="/" class="btn btn-lg btn-primary">
                            <i class="bi bi-house-door me-2"></i>
                            Retour à l'accueil
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<div th:replace="fragments/footer.html"></div>
