<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Formulaire Détail de Vente</h3>
                <p class="text-subtitle text-muted">Ajoutez ou modifiez les détails d'une vente</p>
            </div>
        </div>
    </div>
    <section id="basic-vertical-layouts" class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-12">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title">Détails du Produit</h4>
                    </div>
                    <div class="card-content">
                        <div class="card-body">
                            <form class="form form-vertical" th:action="@{/venteDetail/save}" th:object="${venteDetail}" method="post" data-parsley-validate>
                                <!-- Champs cachés -->
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{vente.id}">
                                <input type="hidden" th:field="*{vente.dateVente}">
                                <input type="hidden" th:field="*{datePeremption}">

                                <div class="form-body">
                                    <div class="row">
                                        <!-- Champ Quantité -->
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label for="qu-icon" class="form-label">Quantité</label>
                                                <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="bi bi-box"></i>
                                                    </span>
                                                    <input type="number" class="form-control" th:field="*{quantite}"
                                                           id="qu-icon" placeholder="Saisissez la quantité"
                                                           data-parsley-required="true">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Champ Prix Unitaire -->
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label for="montant-icon" class="form-label">Prix Unitaire (€)</label>
                                                <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="bi bi-cash"></i>
                                                    </span>
                                                    <input type="number" class="form-control" th:field="*{prixUnitaire}"
                                                           id="montant-icon" placeholder="Prix unitaire du produit"
                                                           data-parsley-required="true" step="0.01">
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Sélection Produit -->
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label for="inputGroupSelect01" class="form-label">Produit</label>
                                                <select class="form-select" th:field="*{produit.id}" id="inputGroupSelect01" data-parsley-required="true">
                                                    <option value="" selected disabled>Choisir un produit...</option>
                                                    <option th:each="produit : ${produits}"
                                                            th:value="${produit.getId()}"
                                                            th:text="${produit.getNom()}"
                                                            th:selected="|${produit.getId()} == ${venteDetail.produit?.getId()}|">
                                                        Produit
                                                    </option>
                                                </select>
                                            </div>
                                        </div>

                                        <!-- Boutons d'action -->
                                        <div class="col-12 d-flex justify-content-end">
                                            <button type="submit" class="btn btn-primary me-1 mb-1">
                                                <i class="bi bi-check-circle"></i> Enregistrer
                                            </button>
                                            <button type="reset" class="btn btn-light-secondary me-1 mb-1">
                                                <i class="bi bi-arrow-clockwise"></i> Réinitialiser
                                            </button>
                                            <a th:href="@{/vente}" class="btn btn-danger me-1 mb-1">
                                                <i class="bi bi-x-circle"></i> Annuler
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
