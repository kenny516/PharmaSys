<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Vente FORMULAIRE</h3>
                <p class="text-subtitle text-muted">Vente formulaire</p>
            </div>
        </div>
    </div>
    <section id="basic-vertical-layouts">
        <div class="row match-height">
            <div class="col-md-6 col-12 flex">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title"></h4>
                    </div>
                    <div class="card-content">
                        <div class="card-body">
                            <form class="form form-vertical" th:action="@{/vente/save}" th:object="${vente}" method="post" data-parsley-validate>
                                <input type="hidden" th:field="*{id}">
                                <div class="form-body">
                                    <div class="row">
                                        <div class="col-12">
                                            <div class="form-group has-icon-left">
                                                <label for="date-icon">Date</label>
                                                <div class="position-relative">
                                                    <input type="datetime-local" class="form-control" placeholder="Nom"
                                                           th:field="*{dateVente}" id="date-icon"
                                                           data-parsley-required="true">
                                                    <div class="form-control-icon">
                                                        <!-- Icône mise à jour pour Date -->
                                                        <i class="bi bi-calendar-date"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-group has-icon-left">
                                                <label for="montant-icon">Montant (attention à ne pas changer si possible)</label>
                                                <div class="position-relative">
                                                    <input type="text" class="form-control" placeholder="Montant"
                                                           th:field="*{montantTotal}" id="montant-icon"
                                                           data-parsley-required="true">
                                                    <div class="form-control-icon">
                                                        <!-- Icône mise à jour pour Montant -->
                                                        <i class="bi bi-cash"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12 d-flex justify-content-end">
                                            <button type="submit" class="btn btn-primary me-1 mb-1">Submit</button>
                                            <button type="reset" class="btn btn-light-secondary me-1 mb-1">Reset</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
