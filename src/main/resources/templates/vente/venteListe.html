<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Ventes</h3>
                <p class="text-subtitle text-muted">Liste des ventes</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table" id="table1">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>date</th>
                            <th>Montant_total</th>
                            <th>Detail</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="vente : ${ventes}">
                            <td th:text="${vente.getId()}"></td>
                            <td th:text="${vente.getDateVente()}"></td>
                            <td th:text="${vente.getMontantTotal()}"></td>
                            <td>
                                <a th:href="@{/vente/{id}/detail(id=${vente.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-three-dots"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/vente/edit(id=${vente.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/vente/delete(id=${vente.getId()})}" class="btn icon btn-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/vente/edit}" class="btn icon btn-primary">
                        <i class="bi bi-plus-circle"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
