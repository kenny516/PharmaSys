<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Ventes</h3>
                <p class="text-subtitle text-muted">Liste des ventes</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
                <form class="form form-vertical" th:action="@{/vente/recherche}" method="post" data-parsley-validate>
                    <div class="row">
                        <!-- Catégorie -->
                        <div class="col-md-4 mb-3">
                            <div class="form-group">
                                <label for="categorie">Catégorie</label>
                                <select class="form-select" id="categorie" name="categorie" >
                                    <option value="" selected disabled>Choisir...</option>
                                    <option th:each="categorie : ${categories}" th:value="${categorie.getId()}" th:text="${categorie.getNom()}"></option>
                                </select>
                            </div>
                        </div>
                        <!-- Public Cible -->
                        <div class="col-md-4 mb-3">
                            <div class="form-group">
                                <label for="publicCible">Public Cible</label>
                                <select class="form-select" id="publicCible" name="publicCible" >
                                    <option value="" selected disabled>Choisir...</option>
                                    <option th:each="publicCible : ${public_cibles}" th:value="${publicCible.getId()}" th:text="${publicCible.getCategorie()}"></option>
                                </select>
                            </div>
                        </div>
                        <!-- Maladie -->
                        <div class="col-md-4 mb-3">
                            <div class="form-group">
                                <label for="maladie">Administration</label>
                                <select class="form-select" id="maladie" name="administration" >
                                    <option value="" selected disabled>Choisir...</option>
                                    <option th:each="administration : ${administrations}" th:value="${administration.getId()}" th:text="${administration.getNom()}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <!-- Boutons -->
                        <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search"></i> Rechercher
                            </button>
                            <button type="reset" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-clockwise"></i> Réinitialiser
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="table1">
                        <thead>
                        <tr>
                            <th class="text-center">Id</th>
                            <th class="text-center">date vente</th>
                            <th class="text-center">Produit</th>
                            <th class="text-center">Montant_total</th>
                            <th class="text-center">Quantite</th>
                            <th class="text-center">Edit</th>
                            <th class="text-center">Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="vente : ${ventes}">
                            <td class="text-center" th:text="${vente.getId()}"></td>
                            <td class="text-center" th:text="${vente.getDateVente()}"></td>
                            <td class="text-center" th:text="${vente.getProduit().getNom()}"></td>
                            <td class="text-center" th:text="${vente.getMontantTotal()}"></td>
                            <td class="text-center" th:text="${vente.getQuantite()}"></td>


                            <td class="text-center">
                                <a th:href="@{/vente/edit(id=${vente.getId()})}" class="btn icon btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/vente/delete(id=${vente.getId()})}" class="btn icon btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/vente/edit}" class="btn icon btn-success">
                        <i class="bi bi-plus-circle"></i> Ajouter une vente
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
