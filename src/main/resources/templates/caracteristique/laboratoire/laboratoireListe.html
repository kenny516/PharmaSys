<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>LABORATOIRES</h3>
                <p class="text-subtitle text-muted">Liste des laboratoires</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table" id="table1">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nom</th>
                            <th>Téléphone</th>
                            <th>Adresse</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="laboratoire : ${laboratoires}">
                            <td th:text="${laboratoire.getId()}"></td>
                            <td th:text="${laboratoire.getNom()}"></td>
                            <td th:text="${laboratoire.getTelephone()}"></td>
                            <td th:text="${laboratoire.getAdresse()}"></td>
                            <td>
                                <a th:href="@{/caracteristique/laboratoire/edit(id=${laboratoire.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/caracteristique/laboratoire/delete(id=${laboratoire.getId()})}" class="btn icon btn-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/caracteristique/laboratoire/edit}" class="btn icon btn-primary">
                        <i class="bi bi-plus-circle"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
