<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>LABORATOIRES</h3>
                <p class="text-subtitle text-muted">Liste des laboratoires</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="table1">
                        <thead>
                        <tr>
                            <th class="text-center">ID</th>
                            <th class="text-center">Nom</th>
                            <th class="text-center">Téléphone</th>
                            <th class="text-center">Adresse</th>
                            <th class="text-center">Modifier</th>
                            <th class="text-center">Supprimer</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="laboratoire : ${laboratoires}">
                            <td class="text-center" th:text="${laboratoire.getId()}"></td>
                            <td class="text-center" th:text="${laboratoire.getNom()}"></td>
                            <td class="text-center" th:text="${laboratoire.getTelephone()}"></td>
                            <td class="text-center" th:text="${laboratoire.getAdresse()}"></td>
                            <td class="text-center">
                                <a th:href="@{/caracteristique/laboratoire/edit(id=${laboratoire.getId()})}" class="btn btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/caracteristique/laboratoire/delete(id=${laboratoire.getId()})}" class="btn btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/caracteristique/laboratoire/edit}" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Ajouter un laboratoire
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
