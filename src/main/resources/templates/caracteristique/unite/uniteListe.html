<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>UNITÉS</h3>
                <p class="text-subtitle text-muted">Liste des unités</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table" id="table1">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nom</th>
                            <th>Description</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="unite : ${unites}">
                            <td th:text="${unite.getId()}"></td>
                            <td th:text="${unite.getNom()}"></td>
                            <td th:text="${unite.getDescription()}"></td>
                            <td>
                                <a th:href="@{/caracteristique/unite/edit(id=${unite.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/caracteristique/unite/delete(id=${unite.getId()})}" class="btn icon btn-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/caracteristique/unite/edit}" class="btn icon btn-primary">
                        <i class="bi bi-plus-circle"></i> Ajouter une unité
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
