<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>MOUVEMENT STOCKS</h3>
                <p class="text-subtitle text-muted">Liste des mouvement de stock</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table" id="table1">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>type de mouvement</th>
                            <th>description</th>
                            <th>medicament</th>
                            <th>quantite</th>
                            <th>date du mouvement</th>
                            <th>Date Péremption</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="mvtstock : ${mvtStocks}">
                            <td th:text="${mvtstock.getId()}"></td>
                            <td th:text="${mvtstock.getTypeMvt().getNom()}"></td>
                            <td th:text="${mvtstock.getDescription()}"></td>
                            <td th:text="${mvtstock.getProduit().nom}"></td>
                            <td th:text="${mvtstock.getQuantite()}"></td>
                            <td th:text="${mvtstock.getDateMvt()}"></td>
                            <td th:text="${mvtstock.getDatePeremption()}"></td>
                            <td>
                                <a th:href="@{/mvtstock/edit(id=${mvtstock.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/mvtstock/delete(id=${mvtstock.getId()})}" class="btn icon btn-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/mvtstock/edit}" class="btn icon btn-primary">
                        <i class="bi bi-plus-circle"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
