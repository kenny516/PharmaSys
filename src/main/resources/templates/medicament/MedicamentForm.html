<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>MEDICAMENTS FORMULAIRE</h3>
                <p class="text-subtitle text-muted">Medicaments formulaire</p>
            </div>
        </div>
    </div>
    <section id="basic-vertical-layouts">
        <div class="row match-height">
            <div class="col-md-6 col-12 flex">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title"></h4>
                    </div>
                    <div class="card-content">
                        <div class="card-body">
                            <form class="form form-vertical" th:action="@{/medicament/save}" th:object="${medicament}" method="post" data-parsley-validate>
                                <input type="hidden" th:field="*{id}">
                                <div class="form-body">
                                    <div class="row">
                                        <div class="col-12">
                                            <div class="form-group has-icon-left">
                                                <label for="first-name-icon">Nom</label>
                                                <div class="position-relative">
                                                    <input type="text" class="form-control" placeholder="Nom"
                                                           th:field="*{nom}" id="first-name-icon"
                                                           data-parsley-required="true">
                                                    <div class="form-control-icon">
                                                        <i class="bi bi-capsule"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-group has-icon-left">
                                                <label for="email-id-icon">Description</label>
                                                <div class="position-relative">
                                                    <input type="text" class="form-control" placeholder="Description"
                                                           th:field="*{description}" id="email-id-icon"
                                                           data-parsley-required="true">
                                                    <div class="form-control-icon">
                                                        <i class="bi bi-file-earmark-text"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-group has-icon-left">
                                                <label for="mobile-id-icon">Prix</label>
                                                <div class="position-relative">
                                                    <input type="number" class="form-control" placeholder="Prix"
                                                           th:field="*{prix}" id="mobile-id-icon"
                                                           data-parsley-required="true">
                                                    <div class="form-control-icon">
                                                        <i class="bi bi-currency-dollar"></i>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-group has-icon-left">
                                                <label class="input-group-text"
                                                       for="inputGroupSelect01">Laboratoire</label>
                                                <select class="form-select" th:field="*{laboratoire}"
                                                        id="inputGroupSelect01"
                                                        data-parsley-required="true">
                                                    <option value="" selected disabled>Choisir...</option>
                                                    <!-- Liste dynamique des laboratoires -->
                                                    <option th:each="laboratoire : ${laboratoires}"
                                                            th:value="${laboratoire.getId()}"
                                                            th:text="${laboratoire.getNom()}"
                                                            th:selected="|${laboratoire.getId()} == ${medicament.laboratoire?.getId()}|">
                                                        Laboratoire
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-12 d-flex justify-content-end">
                                            <button type="submit" class="btn btn-primary me-1 mb-1">Submit</button>
                                            <button type="reset" class="btn btn-light-secondary me-1 mb-1">Reset
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
