<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>MEDICAMENTS</h3>
                <p class="text-subtitle text-muted">Medicaments datatable</p>
            </div>
        </div>
    </div>
    <section class="section">
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table" id="table1">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nom</th>
                            <th>Description</th>
                            <th>Prix</th>
                            <th>Laboratoire</th>
                            <th>Public Cible</th>
                            <th>Maladie</th>
                            <th>Edit</th>
                            <th>Delete</th>

                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="medicament : ${medicaments}">
                            <td th:text="${medicament.getId()}"></td>
                            <td th:text="${medicament.getNom()}"></td>
                            <td th:text="${medicament.getDescription()}"></td>
                            <td th:text="${medicament.getPrix()}"></td>
                            <td th:text="${medicament.getLaboratoire().getNom()}"></td>
                            <td>
                                <a th:href="@{/medicament-public-cible(idMedicament=${medicament.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-three-dots"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/medicament-maladie(idMedicament=${medicament.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-three-dots"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/medicament/edit(id=${medicament.getId()})}" class="btn icon btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/medicament/delete(id=${medicament.getId()})}" class="btn icon btn-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/medicament/edit}" class="btn icon btn-primary">
                        <i class="bi bi-plus-circle"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
