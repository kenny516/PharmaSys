<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>MEDICAMENTS</h3>
                <p class="text-subtitle text-muted">Liste des médicaments avec recherche multicritère</p>
            </div>
        </div>
    </div>
    <section class="section">
        <!-- Formulaire de recherche -->
        <div class="card mb-3">
            <div class="card-body">
                <form class="form form-vertical" th:action="@{/produit/recherche}" method="post" data-parsley-validate>
                    <div class="row">
                        <!-- Categorie -->
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="categorie">Catégorie</label>
                                <select class="form-select" id="categorie" name="categorie"
                                        data-parsley-required="true">
                                    <option value="" selected disabled>Choisir...</option>
                                    <option th:each="categorie : ${categories}"
                                            th:value="${categorie.getId()}"
                                            th:text="${categorie.getNom()}">
                                        Categorie
                                    </option>
                                </select>
                            </div>
                        </div>
                        <!-- Public Cible -->
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="publicCible">Public cible</label>
                                <select class="form-select" id="publicCible" name="publicCible"
                                        data-parsley-required="true">
                                    <option value="" selected disabled>Choisir...</option>
                                    <option th:each="publicCible : ${publicCibles}"
                                            th:value="${publicCible.getId()}"
                                            th:text="${publicCible.getCategorie()}">
                                        Public Cible
                                    </option>
                                </select>
                            </div>
                        </div>
                        <!-- Maladie -->
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="maladie">Maladie</label>
                                <select class="form-select" id="maladie" name="maladie"
                                        data-parsley-required="true">
                                    <option value="" selected disabled>Choisir...</option>
                                    <option th:each="maladie : ${maladies}"
                                            th:value="${maladie.getId()}"
                                            th:text="${maladie.getNom()}">
                                        Maladie
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <!-- Boutons -->
                        <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search"></i> Rechercher
                            </button>
                            <button type="reset" class="btn btn-light-secondary">
                                <i class="bi bi-arrow-clockwise"></i> Réinitialiser
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tableau des médicaments -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table" id="table1">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nom</th>
                            <th>Description</th>
                            <th>Prix</th>
                            <th>Laboratoire</th>
                            <th>Public Cible</th>
                            <th>Maladie</th>
                            <th>Perissable</th>
                            <th>Catégorie</th>
                            <th>Unité</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="produit : ${produits}">
                            <td th:text="${produit.getId()}"></td>
                            <td th:text="${produit.getNom()}"></td>
                            <td th:text="${produit.getDescription()}"></td>
                            <td th:text="${produit.getPrix()}"></td>
                            <td th:text="${produit.getLaboratoire().getNom()}"></td>
                            <td>
                                <a th:href="@{/produit-public-cible(idProduit=${produit.getId()})}"
                                   class="btn icon btn-primary">
                                    <i class="bi bi-three-dots"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/produit-maladie(idProduit=${produit.getId()})}"
                                   class="btn icon btn-primary">
                                    <i class="bi bi-three-dots"></i>
                                </a>
                            </td>
                            <td th:text="${produit.getPerissable()}"></td>
                            <td th:text="${produit.getCategorie().getNom()}"></td>
                            <td th:text="${produit.getUnite().getNom()}"></td>
                            <td>
                                <a th:href="@{/produit/edit(id=${produit.getId()})}"
                                   class="btn icon btn-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/produit/delete(id=${produit.getId()})}"
                                   class="btn icon btn-danger">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/produit/edit}" class="btn icon btn-primary mt-3">
                        <i class="bi bi-plus-circle"></i> Ajouter
                    </a>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
