<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Formulaire Medicaments Maladie</h3>
                <p class="text-subtitle text-muted">Ajouter/Modifier un médicament maladie</p>
            </div>
        </div>
    </div>
    <section id="basic-vertical-layouts" class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="row match-height w-100 justify-content-center">
            <div class="col-md-6 col-12">
                <div class="card">
                    <div class="card-header">
                        <h4 class="card-title">Formulaire</h4>
                    </div>
                    <div class="card-content">
                        <div class="card-body">
                            <form class="form form-vertical" th:action="@{/produit-maladie/save}"
                                  th:object="${produitMaladie}" method="post" data-parsley-validate>
                                <input type="hidden" th:field="*{id.idProduit}">
                                <input type="hidden" th:field="*{id.idMaladie}">
                                <input type="hidden" th:field="*{produit.id}">
                                <div class="form-body">
                                    <div class="row">
                                        <!-- Champ Medicament -->
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label for="medicament" class="form-label">Médicament</label>
                                                <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="bi bi-capsule"></i>
                                                    </span>
                                                    <input type="text" class="form-control"
                                                           th:field="*{produit.nom}" placeholder="Nom du médicament"
                                                           id="medicament" data-parsley-required="true" readonly>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Champ Maladie -->
                                        <div class="col-12">
                                            <div class="form-group">
                                                <label for="maladie" class="form-label">Maladie</label>
                                                <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="bi bi-virus"></i>
                                                    </span>
                                                    <select th:field="*{maladie}" class="form-control"
                                                            id="maladie" data-parsley-required="true">
                                                        <option th:each="maladie : ${maladies}"
                                                                th:value="${maladie.id}"
                                                                th:text="${maladie.getNom()}"
                                                                th:selected="${produitMaladie.maladie?.id == maladie?.id}">
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Boutons d'action -->
                                        <div class="col-12 d-flex justify-content-end">
                                            <button type="submit" class="btn btn-primary me-1 mb-1">
                                                <i class="bi bi-check-circle"></i> Soumettre
                                            </button>
                                            <button type="reset" class="btn btn-light-secondary me-1 mb-1">
                                                <i class="bi bi-arrow-counterclockwise"></i> Réinitialiser
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
