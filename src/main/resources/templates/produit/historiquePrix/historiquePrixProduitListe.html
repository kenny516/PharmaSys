<div th:replace="fragments/sidebar.html"></div>

<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Historique des prix</h3>
                <p class="text-subtitle text-muted">Historique des prix</p>
            </div>
        </div>
    </div>
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <form class="form form-vertical" th:action="@{/historiquePrixProduits/}" method="get" data-parsley-validate>
                <div class="row">
                    <!-- Catégorie -->
                    <div class="col-md-4 mb-3">
                        <div class="form-group">
                            <label for="historiquePrixProduits">Historique prix</label>
                            <select class="form-select" id="historiquePrixProduits" name="idProduit">
                                <option value="" selected disabled>Choisir...</option>
                                <option th:each="Produit : ${produits}"
                                        th:value="${Produit.id}"
                                        th:text="${Produit.nom}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12 d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search"></i> Rechercher
                            </button>
                            <button type="reset" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-clockwise"></i> Réinitialiser
                            </button>
                        </div>
                    </div>
                </div>
            </form>
            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="table1">
                                <thead>
                                <tr>
                                    <th class="text-center">Nom</th>
                                    <th class="text-center">Description</th>
                                    <th class="text-center">Prix</th>
                                    <th class="text-center">Date</th>
                                    <th class="text-center">Edit</th>
                                    <th class="text-center">Delete</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="historiquePrixProduits : ${historiques}">
                                    <td class="text-center" th:text="${historiquePrixProduits.produit.nom}"></td>
                                    <td class="text-center" th:text="${historiquePrixProduits.produit.description}"></td>
                                    <td class="text-center" th:text="${historiquePrixProduits.prix}"></td>
                                    <td class="text-center" th:text="${historiquePrixProduits.date_changement}"></td>
<!--                                    action -->
                                    <td class="text-center">
                                        <a th:href="@{/historiquePrixProduits/edit(idHistoriquePrixProduit=${historiquePrixProduits.getId()})}"
                                           class="btn btn-outline-primary btn-sm">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </td>
                                    <td class="text-center">
                                        <a th:href="@{/historiquePrixProduits/delete(idHistoriquePrixProduit=${historiquePrixProduits.getId()})}"
                                           class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            <a th:href="@{/historiquePrixProduits/new}" class="btn btn-success mt-3">
                                <i class="bi bi-plus-circle"></i> Ajouter un mouvement de stock
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<div th:replace="fragments/footer.html"></div>
