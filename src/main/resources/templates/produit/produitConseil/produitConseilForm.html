<div th:replace="fragments/sidebar.html"></div>
<div class="page-heading">
    <div class="page-title">
        <div class="row">
            <div class="col-12 col-md-6 order-md-1 order-last">
                <h3>Produit conseil Formulaire</h3>
                <p class="text-subtitle text-muted">Créer ou modifier un produit conseil</p>
            </div>
        </div>
    </div>
    <section id="basic-vertical-layouts" class="d-flex align-items-center justify-content-center vh-100">
        <div class="row w-100 justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h4 class="card-title">Produit conseil</h4>
                    </div>
                    <div class="card-body">
                        <form class="form form-vertical" th:action="@{/produi-conseils/save}" th:object="${produitConseils}" method="post" data-parsley-validate>
                            <input type="hidden" th:field="*{id}">
                            <div class="form-body">
                                <div class="row">

                                    <!-- produit -->
                                    <div class="col-12 mb-3">
                                        <label for="inputGroupSelect01" class="form-label">Produit</label>
                                        <select class="form-select" id="inputGroupSelect01" th:field="*{produit.id}" data-parsley-required="true">
                                            <option value="" selected disabled>Choisir...</option>
                                            <option th:each="produit : ${produits}"
                                                    th:value="${produit.getId()}"
                                                    th:text="${produit.getNom()}"
                                                    th:selected="|${produit.getId()} == ${produit?.getId()}|">
                                            </option>
                                        </select>
                                    </div>

                                    <!-- Champ Date -->
                                    <div class="col-12">
                                        <div class="form-group">
                                            <label for="date-icon" class="form-label">Date debut</label>
                                            <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="bi bi-calendar-date"></i>
                                                    </span>
                                                <input type="date" class="form-control"
                                                       th:field="*{dateDebut}" id="date-icon"
                                                       data-parsley-required="true" placeholder="Sélectionnez la date">
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Champ Date -->
                                    <div class="col-12">
                                        <div class="form-group">
                                            <label for="date-icon2" class="form-label">Date fin</label>
                                            <div class="input-group">
                                                    <span class="input-group-text">
                                                        <i class="bi bi-calendar-date"></i>
                                                    </span>
                                                <input type="date" class="form-control"
                                                       th:field="*{dateFin}" id="date-icon2"
                                                       data-parsley-required="true" placeholder="Sélectionnez la date">
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Description -->
                                    <div class="col-12 mb-3">
                                        <label for="description-icon" class="form-label">Description</label>
                                        <div class="input-group">
                                            <span class="input-group-text">
                                                <i class="bi bi-file-earmark-text"></i>
                                            </span>
                                            <input type="text" class="form-control" id="description-icon" placeholder="Description"
                                                   th:field="*{description}" data-parsley-required="true">
                                        </div>
                                    </div>

                                    <!-- Boutons -->
                                    <div class="col-12 d-flex justify-content-end">
                                        <button type="submit" class="btn btn-primary me-2">Enregistrer</button>
                                        <button type="reset" class="btn btn-secondary">Réinitialiser</button>
                                        <a th:href="@{/produi-conseils}" class="btn btn-danger me-1 mb-1">
                                            <i class="bi bi-x-circle"></i> Annuler
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<div th:replace="fragments/footer.html"></div>
